[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "permaudit"
version = "1.1.0"
description = "Read-only file permission auditor: world-writable, SUID, loose keys, .env and credential files. Suggests chmod fixes, JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["file-permissions", "hardening", "audit", "linux"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/permaudit"

[project.scripts]
permaudit = "permaudit:main"

[tool.setuptools]
py-modules = ["permaudit"]
